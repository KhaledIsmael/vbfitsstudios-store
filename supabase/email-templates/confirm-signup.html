<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>VB FITS STUDIOS</title>
</head>
<body style="margin:0;padding:0;background:#F5F5F5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F5F5;padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#FFFFFF;border:1px solid #EAEAEA;">

          <tr>
            <td style="background:#111111;padding:32px 40px;text-align:center;">
              <p style="margin:0 0 6px 0;color:#FFFFFF;font-size:9px;letter-spacing:0.25em;text-transform:uppercase;">Private Atelier</p>
              <h1 style="margin:0;color:#FFFFFF;font-size:20px;font-weight:300;letter-spacing:0.15em;text-transform:uppercase;">VB FITS STUDIOS</h1>
            </td>
          </tr>

          <tr>
            <td style="background:#FAFAFA;border-bottom:1px solid #EAEAEA;padding:28px 40px;text-align:center;">
              <div style="display:inline-block;width:44px;height:44px;border:1.5px solid #111111;border-radius:50%;text-align:center;line-height:44px;margin-bottom:14px;">
                <span style="font-size:18px;color:#111111;">✓</span>
              </div>
              <p style="margin:0 0 4px 0;font-size:9px;color:#888888;text-transform:uppercase;letter-spacing:0.16em;">Welcome</p>
              <h2 style="margin:0;font-size:20px;font-weight:300;color:#111111;letter-spacing:0.1em;text-transform:uppercase;">Confirm Your Account</h2>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 40px 16px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#555555;line-height:1.8;letter-spacing:0.02em;">
                Thank you for joining VB FITS STUDIOS.<br/>
                Tap the button below to verify your email and enter the atelier.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 40px 32px;text-align:center;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background:#111111;color:#FFFFFF;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;padding:14px 36px;border:1px solid #111111;">
                Confirm My Account
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:0 40px 32px;text-align:center;">
              <p style="margin:0;font-size:10px;color:#999999;line-height:1.6;">
                If you didn't request this, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <tr>
            <td style="background:#F5F5F5;padding:20px 40px;text-align:center;border-top:1px solid #EAEAEA;">
              <p style="margin:0;font-size:10px;color:#AAAAAA;letter-spacing:0.08em;text-transform:uppercase;">© 2026 VB FITS STUDIOS. ALL RIGHTS RESERVED.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
