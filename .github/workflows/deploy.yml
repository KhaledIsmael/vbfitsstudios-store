name: Staging Validation & Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 1: Static Analysis, Staging Build & Playwright Smoke Testing
  # ───────────────────────────────────────────────────────────────────────────
  validate-staging:
    name: Staging Validation (tsc + vite build + smoke tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_APP_ENV: staging
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://nsdurxslkhxqjwlbcpxc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZHVyeHNsa2h4cWp3bGJjcHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NzE4NDksImV4cCI6MjEwNTM0Nzg0OX0.BuUa2mrQZzN5lNWkuXUxmYT0tNcKSs7l0KGLWkRZDdQ' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Static Type Checking
      - name: Run TypeScript Typecheck (tsc)
        run: npx tsc --noEmit

      # 2. Staging Application Bundle Build
      - name: Run Vite Build (Staging Mode)
        run: npm run build:staging

      # 3. Setup Playwright for End-to-End Smoke Verification
      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      # 4. Execute Checkout Flow Smoke Tests against Staging Supabase
      - name: Run Playwright Checkout Smoke Tests
        run: npm run test:smoke
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173

      # 5. Archive Test Reports & Artifacts on Failure
      - name: Archive Smoke Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 2: Automated Production Deployment (Gated by Stage 1 Passing)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: validate-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build:production
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      # If using Vercel Production CLI or Deploy Action:
      - name: Deploy Production Bundle to Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
